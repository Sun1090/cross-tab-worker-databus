name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to verify/release, for example v0.20.6"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      # Single source of truth for the tag being released. `github.ref_name`
      # is the tag only on a tag push; on workflow_dispatch it is the selected
      # BRANCH, so the manual path must take the `tag` input instead. Using
      # a raw `$GITHUB_REF_NAME` in the release/publish steps made a manual
      # dispatch create a GitHub release named "main" and derive the npm
      # version from the branch.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # verify:compat needs the previous release tags as its baseline.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm check = typecheck + build + test; build must precede test because
      # tests/dual-format.test.ts imports the dist artifacts.
      - name: Verify (typecheck + build + unit tests)
        run: pnpm check

      - name: Public export compatibility
        # Blocking: a release that silently drops a public subpath export or
        # type entry is a breaking change shipped as a patch.
        run: pnpm verify:compat

      - name: Packed consumer smoke
        # Verifies the actual tarball before publish, so a broken
        # `files`/`exports` mapping cannot reach the registry.
        run: pnpm verify:pack

      - name: Extract changelog for this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

      - name: Publish to npm
        # Skipped when no token is configured (e.g. the release was published
        # manually) so tagging an already-published version still goes green.
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already published; skipping npm publish."
          else
            npm publish --provenance --registry https://registry.npmjs.org
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published npm consumers
        # Blocking: a release whose published package cannot be consumed is a
        # failed release. The retry budget covers registry propagation lag.
        id: verify_published
        env:
          PUBLISHED_VERSION: ${{ env.RELEASE_TAG }}
          PUBLISHED_VERIFY_ATTEMPTS: 24
          PUBLISHED_VERIFY_DELAY_MS: 5000
        run: pnpm verify:published

      - name: Record release verification context
        if: ${{ always() }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo "### Release verification"
            echo "- tag: ${VERSION}"
            echo "- npm: $(npm view "${PACKAGE_NAME:-cross-tab-worker-databus}@${VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || echo unavailable)"
            echo "- commit: ${GITHUB_SHA}"
            echo "- published-consumer-check: ${{ steps.verify_published.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
