name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to verify/release, for example v0.20.6"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
      # Single source of truth for the tag being released. `github.ref_name`
      # is the tag only on a tag push; on workflow_dispatch it is the selected
      # BRANCH, so the manual path must take the `tag` input instead. Using
      # a raw `$GITHUB_REF_NAME` in the release/publish steps made a manual
      # dispatch create a GitHub release named "main" and derive the npm
      # version from the branch.
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          # verify:compat needs the previous release tags as its baseline.
          fetch-depth: 0
          fetch-tags: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Validate release version and notes
        # Fail before any release or publish side effect on a mismatched tag.
        run: node scripts/verify-release-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # pnpm check = typecheck + build + test; build must precede test because
      # tests/dual-format.test.ts imports the dist artifacts.
      - name: Verify (typecheck + build + unit tests)
        run: pnpm check

      - name: Lint
        # A tag can point at a commit that never passed the CI lint job (e.g.
        # tagged directly on a branch), so the release gate re-runs it.
        run: pnpm lint

      - name: Public export compatibility
        # Blocking: a release that silently drops a public subpath export or
        # type entry is a breaking change shipped as a patch.
        run: pnpm verify:compat

      - name: Public type surface
        # Blocking, for the same reason as above: a dropped type-only export
        # changes no runtime key, so this is the only check that can see it.
        run: pnpm verify:types

      - name: Packed consumer smoke
        # Verifies the actual tarball before publish, so a broken
        # `files`/`exports` mapping cannot reach the registry.
        run: pnpm verify:pack

      - name: Extract changelog for this version
        run: |
          VERSION="${RELEASE_TAG#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1; next }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" >&2
            exit 1
          fi
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          fi

      - name: Publish to npm
        # Skipped when no token is configured (e.g. the release was published
        # manually) so tagging an already-published version still goes green.
        if: ${{ env.HAS_NPM_TOKEN == 'true' }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          if npm view "${PACKAGE_NAME}@${VERSION}" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "${PACKAGE_NAME}@${VERSION} is already published; skipping npm publish."
          else
            npm publish --provenance --registry https://registry.npmjs.org
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published npm consumers
        # Blocking: a release whose published package cannot be consumed is a
        # failed release. The retry budget covers registry propagation lag.
        id: verify_published
        env:
          PUBLISHED_VERSION: ${{ env.RELEASE_TAG }}
          # `npm publish` reports success long before `npm pack <name>@<version>`
          # can resolve the version, and the budget is a sum of two measured lags, not
          # a guess. Re-derive both: npm's own `time[<version>]` stamp for the release
          # versus the `Publish to npm` step completion, which `gh api
          # repos/<owner>/<repo>/actions/runs/<id>/attempts/<n>/jobs` prints (attempt 1
          # is the failed one). Measured on 0.21.27 through 0.21.35 (2026-09-25): that
          # ack -> `time[]` gap was 248.7 / 96.8 / 74.8 / 310.0 / 127.2 / 76.1 / 75.5 /
          # 75.8 / 127.3 s in version order — nine values, counted off this list. Do not
          # read the middle of that as a constant: 0.21.32-0.21.34 recorded at 76.1, 75.5
          # and 75.8 s (a 0.6 s spread) and this comment called the lag stable, then
          # 0.21.35 came back at 127.3 s. What nine samples do support is the weaker claim
          # the ceiling rests on — the gap lives in 74.8-310.0 s and none has beaten the
          # 310 s below. The verify's own duration is the other half of the
          # picture, and it is remarkably flat: the five green tag runs from 0.21.25 to
          # 0.21.29 took 307, 304, 305, 304 and 304 s against a then-360 s ceiling,
          # 0.21.31's took 308 s, 0.21.32's, 0.21.33's and 0.21.34's took 304 s each, and
          # 0.21.35's took 305 s, all against this one. Ten samples inside a 5-second band
          # is the regularity the
          # cache lifetime below explains — a 300 s object plus a few seconds of command
          # time — and it is measured, not a habit: read
          # `steps[].started_at`/`completed_at` for the `Verify published npm consumers`
          # step of each release run. 0.21.33 and 0.21.34 are the model's two cleanest
          # samples and they repeat each other: records 75.5 s and 75.8 s in, both
          # runners still taking 304 s — one lifetime after their own first fetch.
          # 0.21.35 fits the same shape (record 127.3 s in, step 305 s).
          # 0.21.32 is the one carrying the laptop-side reading: record
          # 76.1 s in, a `no-cache` read from a laptop saw the new `latest` 151 s in, and
          # the runner took 304 s.
          # The ceiling's shape is explained by the packument
          # being served `cache-control: public, max-age=300` — a copy anywhere in the
          # path is up to five minutes stale *by design*, so resolution cannot beat one
          # cache lifetime after a write that lands inside it. Which copy (npm's local
          # cache, or an intermediate) served these stale views is NOT established, and
          # the counter-observation this comment used to offer against a local account is
          # WITHDRAWN: it joined two machines. The "local pack had succeeded by 21:44:35Z"
          # read came from a laptop, while the 1 s green at 21:47:10Z was a *new runner
          # job*, whose npm cache starts empty -- which is what a local account predicts,
          # not what refutes it. The one reading a purely-local account still cannot
          # explain is the ETARGET at 21:45:07Z: 364 s after the poll loop opened at
          # 21:39:03Z, so ~60 s after a copy taken then must have expired.
          # So the rule is arithmetic, not a model — worst-case ack->`time[]`
          # gap plus one cache lifetime — and 0.21.30 showed the sum is not theoretical:
          # it burned its whole 360 s ceiling (48 x 7.5 s) and still saw ETARGET at
          # 21:45:07Z while the tarball HEAD and a local pack had both succeeded by
          # 21:44:35Z, then resolved on a retry at
          # 21:47:10Z — 487 s past its ack. 96 x 7.5 s = 720 s clears 310 + 300 with
          # margin, and costs nothing when the package already resolves, because the loop
          # returns on the first successful pack. 0.21.31 and 0.21.32 are the first two
          # runs to exercise this ceiling, both green on attempt 1, and their two splits
          # say which term the wait buys: 127.2 s of record then ~181 s of cache for the
          # one; 76.1 s of record, a laptop reading the new `latest` at 151 s, and 304 s
          # before this runner saw it for the other — one lifetime after its own fetch.
          # A red here is still adjudicated by
          # re-running the failed step against the SAME tag, never by moving or
          # re-pushing it: docs/release-checklist.md.
          PUBLISHED_VERIFY_ATTEMPTS: 96
          PUBLISHED_VERIFY_DELAY_MS: 7500
        run: pnpm verify:published

      - name: Record release verification context
        if: ${{ always() }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          {
            echo "### Release verification"
            echo "- tag: ${VERSION}"
            echo "- npm: $(npm view "${PACKAGE_NAME:-cross-tab-worker-databus}@${VERSION}" version --registry https://registry.npmjs.org 2>/dev/null || echo unavailable)"
            echo "- commit: ${GITHUB_SHA}"
            echo "- published-consumer-check: ${{ steps.verify_published.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"
