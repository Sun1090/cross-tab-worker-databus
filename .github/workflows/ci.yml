name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Bench smoke (Node, no thresholds)
        # Keep the bench files runnable in CI without timing thresholds —
        # shared-runner noise makes numeric gates unreliable here; the
        # bench-compare gate is the local trend check instead.
        run: pnpm bench
      - name: Dependency audit
        # pnpm audit against the public registry; CI runners use npmjs.org so
        # the audit endpoint is available (locally the mirror registry lacks
        # it — use --registry=https://registry.npmjs.org). Fails the build on
        # known-vulnerability advisories; pnpm-workspace.yaml overrides pin the
        # patched ranges.
        run: pnpm audit

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E
        env:
          CI: true
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
