name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # verify:compat diffs the public export map against the most recent
          # release tag, so the tags must be present in the checkout.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Coverage thresholds
        # vitest.config.ts carries the coverage floors (98/96/98/99). Running
        # the gate in CI keeps them enforced instead of advisory.
        run: pnpm test:coverage
      - name: Public export compatibility
        # Catches an accidentally removed/renamed subpath export or type entry
        # on the PR that introduces it, rather than at release time.
        run: pnpm verify:compat
      - name: Public type surface
        # A type-only export emits no runtime key, so neither the
        # `Object.keys()` freeze in tests/dual-format.test.ts nor the
        # package.json field comparison above can see one dropped from the
        # barrel — or a public signature naming a type no entry exports.
        run: pnpm verify:types
      - name: Packed consumer smoke
        # Packs the tarball and imports every public subpath as both ESM and
        # CJS, so a broken `files`/`exports` mapping fails here, not on npm.
        run: pnpm verify:pack
      - name: Bench smoke (Node, no thresholds)
        # Keep the bench files runnable in CI without timing thresholds —
        # shared-runner noise makes numeric gates unreliable here; the
        # bench-compare gate is the local trend check instead.
        run: pnpm bench
      - name: Dependency audit
        # pnpm audit against the public registry; CI runners use npmjs.org so
        # the audit endpoint is available (locally the mirror registry lacks
        # it — use --registry=https://registry.npmjs.org). Fails the build on
        # known-vulnerability advisories; pnpm-workspace.yaml overrides pin the
        # patched ranges.
        run: pnpm audit

  typescript-7:
    # `verify:types` has two backends: TypeScript 6's in-process object API and
    # 7's snapshot/handle API (scripts/type-surface.mjs). The compiler this
    # repository installs is 6.x, so without this job the handle backend is never
    # executed — and a backend that is never executed is a comment, not a gate.
    # That matters concretely: the handle facade's first alias-resolution
    # implementation was wrong in a way that made the closure check miss a
    # deliberately leaked type while the clean tree stayed green on both
    # compilers (docs/progress.md Phase 330).
    #
    # The compiler is replaced in place rather than installed as a second copy,
    # because the gate resolves `typescript` as a bare specifier from its own
    # directory. The build runs first, on 6.x, so this job cannot be read as a
    # claim about emitting declarations with 7.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          # The non-removal check diffs against the previous release tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build declarations (TypeScript 6)
        run: pnpm build
      - name: Swap in TypeScript 7
        run: |
          npm pack typescript@7.0.2 --pack-destination "$RUNNER_TEMP" --silent > /dev/null
          tar -xzf "$RUNNER_TEMP/typescript-7.0.2.tgz" -C "$RUNNER_TEMP"
          rm -rf node_modules/typescript
          mv "$RUNNER_TEMP/package" node_modules/typescript
          node -p "require('typescript').version"
      - name: Public type surface on TypeScript 7
        # Must print the same summary line as the 6.x run in `verify`.
        run: pnpm verify:types

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E
        env:
          CI: true
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
