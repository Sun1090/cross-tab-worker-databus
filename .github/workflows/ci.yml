name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # verify:compat diffs the public export map against the most recent
          # release tag, so the tags must be present in the checkout.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify package
        run: pnpm check
      - name: Lint
        run: pnpm lint
      - name: Coverage thresholds
        # vitest.config.ts carries the coverage floors (98/96/98/99). Running
        # the gate in CI keeps them enforced instead of advisory.
        run: pnpm test:coverage
      - name: Public export compatibility
        # Catches an accidentally removed/renamed subpath export or type entry
        # on the PR that introduces it, rather than at release time.
        run: pnpm verify:compat
      - name: Public type surface
        # A type-only export emits no runtime key, so neither the
        # `Object.keys()` freeze in tests/dual-format.test.ts nor the
        # package.json field comparison above can see one dropped from the
        # barrel — or a public signature naming a type no entry exports.
        run: pnpm verify:types
      - name: Public type surface is still sensitive
        # A clean run proves nothing by itself: both compiler backends print the
        # same success line whether they walked the surface or missed it. This
        # mutates the tree in the two ways the gate exists to catch, requires a
        # failure each time, and restores the files.
        run: pnpm verify:types:sensitivity
      - name: Packed consumer smoke
        # Packs the tarball and imports every public subpath as both ESM and
        # CJS, so a broken `files`/`exports` mapping fails here, not on npm.
        run: pnpm verify:pack
      - name: Bench smoke (Node, no thresholds)
        # Keep the bench files runnable in CI without timing thresholds —
        # shared-runner noise makes numeric gates unreliable here; the
        # bench-compare gate is the local trend check instead.
        run: pnpm bench
      - name: Dependency audit
        # pnpm audit against the public registry; CI runners use npmjs.org so
        # the audit endpoint is available (locally the mirror registry lacks
        # it — use --registry=https://registry.npmjs.org). Fails the build on
        # known-vulnerability advisories; pnpm-workspace.yaml overrides pin the
        # patched ranges.
        run: pnpm audit

  typescript-7:
    # `verify:types` has two backends: TypeScript 6's in-process object API and
    # 7's snapshot/handle API (scripts/type-surface.mjs). The `verify` job runs
    # the first, because the package named `typescript` is the 6.0.x alias that
    # typescript-eslint's peer range requires (docs/progress.md Phase 334). So
    # without this job the handle backend is never executed — and a backend that
    # is never executed is a comment, not a gate. That matters concretely: the
    # handle facade's first alias-resolution implementation was wrong in a way
    # that made the closure check miss a deliberately leaked type while the clean
    # tree stayed green on both compilers (docs/progress.md Phase 330).
    #
    # This job used to *replace* node_modules/typescript with a real 7 package
    # built from an `npm install` in a scratch directory, including the
    # per-platform sibling package. That was fragile twice over — the first run
    # failed on the missing platform package, and the swap silently left
    # typescript-eslint on 6 because pnpm resolves that peer per package. Since
    # Phase 335 the gate takes `--compiler=<specifier>` and the handle facade
    # imports its three `unstable/*` subpaths through it, so the 7 compiler is
    # simply the lockfile alias and no directory is mutated.
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
        with:
          # The non-removal check diffs against the previous release tag.
          fetch-depth: 0
          fetch-tags: true
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build declarations
        # Emitted by TypeScript 7 here *and* in `verify`: the alias supplies `tsc`
        # 7 in both jobs, so "built on 6.x" is no longer the difference between
        # them. Kept as its own step because the gate below reads `dist/*.d.ts`.
        run: pnpm build
      - name: Public type surface and its sensitivity, on the 7 backend
        # One command, two legs: the surface check and the two mutations. Both
        # must print the same counts as the 6.x run in `verify` — `6 entries, 90
        # importable names` — while naming their own compiler in the
        # parenthetical, so a log cannot be attributed to the wrong backend. This
        # is the leg that would have caught the handle adapter's first alias
        # resolution, which returned the alias itself and so missed a deliberately
        # leaked type while both trees reported `surface closed`.
        run: pnpm verify:types:handle
      - name: Consumer type check, both compiler versions
        # The gates above check the declarations with this repository's compiler
        # and import the tarball at runtime; neither answers "can a consumer's
        # compiler build against these declarations". Both versions run here
        # because this is the job that already pays for a second compiler, and a
        # consumer on 6.x is still the common case.
        run: |
          pnpm verify:consumer-types 6.0.3
          pnpm verify:consumer-types 7.0.2

  browser:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run browser E2E
        env:
          CI: true
          PLAYWRIGHT_CHANNEL: chromium
        run: pnpm test:e2e
      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-diagnostics-${{ github.run_id }}
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
