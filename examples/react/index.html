<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>React 跨 Tab 数据总线示例</title>
    <!-- React is bundled from the local install by scripts/build-example-vendor.mjs
         (run via `pnpm build:examples`, which `pnpm examples` and `pnpm test:e2e`
         both call), so this page needs no network access and can be driven from CI.
         Both specifiers point at the one bundle on purpose: react-dom's reconciler
         and the hooks the page imports must come from the same React instance. -->
    <script type="importmap">
      {
        "imports": {
          "react": "./vendor/react.esm.js",
          "react-dom/client": "./vendor/react.esm.js",
          "centrifuge": "/node_modules/centrifuge/build/index.mjs"
        }
      }
    </script>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
      .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; background: #e5e7eb; }
      .badge.connected { background: #d1fae5; }
      .badge.connecting, .badge.disconnected { background: #fef3c7; }
      .badge.error { background: #fee2e2; }
      ul { max-height: 300px; overflow: auto; }
      button { margin-right: 8px; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.jsx"></script>
  </body>
</html>
